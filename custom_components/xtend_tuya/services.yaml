get_camera_stream_url:
  fields:
    device_id:
      required: true
    source:
      required: false
      example: "tuya_sharing"
      default: "tuya_sharing"
    stream_type:
      required: false
      example: "rtsp"
      default: "rtsp"

call_api:
  fields:
    source:
      required: true
      example: "tuya_sharing"
    method:
      required: true
      example: "GET"
      default: "GET"
    url:
      required: true
      example: "/v1.0/devices/{device_id}/webrtc-configs"
    payload:
      required: false

webrtc_get_ice_servers:
  fields:
    device_id:
      required: true
    session_id:
      required: true
      example: "test1"
    source:
      required: false
      example: "tuya_iot"
      default: "tuya_iot"
    format:
      required: false
      example: "SimpleWHEP"
      default: "GO2RTC"

webrtc_sdp_exchange:
  fields:
    device_id:
      required: true
    session_id:
      required: true
      example: "test1"
    source:
      required: false
      example: "tuya_iot"
      default: "tuya_iot"

webrtc_debug:
  fields:
    session_id:
      required: true
      example: "test1"
    source:
      required: false
      example: "tuya_iot"
      default: "tuya_iot"

create_temporary_password:
  name: "Create Temporary Password"
  description: "Creates a time-restricted temporary passcode for a Tuya smart lock."
  fields:
    device_id:
      required: true
      name: "Device ID"
      description: "The Tuya device ID of the smart lock."
      example: "eb1234567890abcdef"
    password:
      required: true
      name: "Password"
      description: "The 6-8 digit numeric passcode to create."
      example: "123456"
    name:
      required: false
      name: "Name / Alias"
      description: "An optional name or label for the passcode."
      example: "Guest PIN"
      default: "HA Temp Password"
    effective_time:
      required: false
      name: "Effective Timestamp (ms)"
      description: "Unix epoch timestamp in milliseconds when passcode becomes active (default: now)."
      example: 1757048400000
    invalid_time:
      required: false
      name: "Invalid Timestamp (ms)"
      description: "Unix epoch timestamp in milliseconds when passcode expires (default: 24h from now)."
      example: 1757062800000
    source:
      required: false
      example: "tuya_iot"
      default: "tuya_iot"