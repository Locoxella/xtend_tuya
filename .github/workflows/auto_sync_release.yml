name: Sync Upstream & Release Custom Fork

on:
  schedule:
    # Corre automáticamente cada 6 horas
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permite ejecutar el workflow manualmente desde la pestaña Actions en GitHub

permissions:
  contents: write

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork Repository
        uses: actions/checkout@v4
        with:
          ref: feature/guirnalda-effects
          fetch-depth: 0

      - name: Fetch Upstream Releases
        id: check_upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_TAG=$(gh api repos/azerty9971/xtend_tuya/releases/latest --jq '.tag_name')
          echo "UPSTREAM_TAG=$UPSTREAM_TAG" >> $GITHUB_ENV
          
          # Buscar si ya existe algún release en el fork para esta versión de upstream
          LATEST_FORK_TAG=$(gh api repos/${{ github.repository }}/releases --jq ".[].tag_name | select(starts_with(\"${UPSTREAM_TAG}-guirnalda\"))" | head -n 1)
          
          if [ -z "$LATEST_FORK_TAG" ]; then
            MY_TAG="${UPSTREAM_TAG}-guirnalda.1"
            echo "SHOULD_RELEASE=true" >> $GITHUB_ENV
          else
            echo "Ya existe una release en el fork para $UPSTREAM_TAG ($LATEST_FORK_TAG)."
            echo "SHOULD_RELEASE=false" >> $GITHUB_ENV
            MY_TAG="$LATEST_FORK_TAG"
          fi
          echo "MY_TAG=$MY_TAG" >> $GITHUB_ENV

      - name: Sync & Merge Upstream
        if: env.SHOULD_RELEASE == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git remote add upstream https://github.com/azerty9971/xtend_tuya.git || true
          git fetch upstream main
          
          git merge upstream/main -m "Merge upstream main ($UPSTREAM_TAG) into feature/guirnalda-effects"
          git push origin feature/guirnalda-effects

      - name: Create Release in Fork
        if: env.SHOULD_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$MY_TAG" \
            --target feature/guirnalda-effects \
            --title "$MY_TAG" \
            --notes "Release automática sincronizada con upstream $UPSTREAM_TAG + parches guirnalda."
